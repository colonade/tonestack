# Webseite auf GitHub Pages veröffentlichen (ab 2026-11-20; ersetzt den eigenen Apache-Server).
# Adresse: https://tonestack.fluxstatus.de/ (eigene Domain, in Settings → Pages eingetragen; DNS: CNAME tonestack → colonade.github.io).
# Inhalt: web/tonestack/ plus die Downloads des aktuellen Releases (scripts/pack-web.sh mit SITE=…, Prüfsummen des Releases geprüft).
# Start: nach jedem erfolgreichen Lauf von „Plugins“ auf main (neues Release), bei Pushes auf main mit Änderungen an der Seite, von Hand.
# Solange Pages nicht eingeschaltet ist (Settings → Pages → Source: GitHub Actions) oder das Release zur aktuellen Version noch fehlt,
# endet der Lauf ohne Fehler mit einem Hinweis und veröffentlicht nichts.
name: Pages
on:
  workflow_run:
    workflows: [Plugins]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['web/**', 'scripts/pack-web.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:   # Veröffentlichungen nacheinander; ein neuerer Lauf ersetzt einen wartenden
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - name: Voraussetzungen prüfen
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          eval "$(bash scripts/versions.sh)"
          if ! gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "::notice::GitHub Pages ist nicht eingeschaltet (Settings → Pages → Source: GitHub Actions) – nichts veröffentlicht"; echo "go=0" >> "$GITHUB_OUTPUT"
          elif ! gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG gibt es noch nicht (wird gebaut?) – nichts veröffentlicht; nach dem Release startet dieser Workflow erneut"; echo "go=0" >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; echo "Release $TAG"; fi
      - name: Seite packen
        if: steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: SITE=_site bash scripts/pack-web.sh
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4.0.0
        if: steps.check.outputs.go == '1'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.go == '1'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
