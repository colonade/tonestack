# Plugins bauen und veröffentlichen: Linux (CLAP, VST3; Ubuntu 24.04) und Mac (Audio Unit für Logic, VST3; macOS 15).
# Start: von Hand (Actions → Plugins → Run workflow) oder bei jedem Push auf main mit Änderungen an Quellen oder Bau.
# Ergebnis: Artefakte "tonestack-linux" und "tonestack-mac"; auf main das GitHub-Release laney-<V>_yamaha-<V>_b15nf-<V> (ältere werden gelöscht).
# Sicherheit: Die Bau-Jobs (fremde Werkzeuge und SDKs) laufen nur mit Leserechten und ohne gespeicherte Zugangsdaten.
# Nur der kleine Veröffentlichungsschritt darf schreiben, und nur Releases; ins Repo wird nichts geschrieben.
name: Plugins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'mac/**', 'reaper-clap/**', 'scripts/pack-plugins.sh', 'scripts/release.sh', 'scripts/versions.sh', '.github/workflows/plugins.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Werkzeuge
        run: sudo apt-get update -q && sudo apt-get install -y -q libcairo2-dev libx11-dev ninja-build cmake zip
      - name: Bauen (CLAP, VST3, Testwerkzeuge)
        run: |
          set -o pipefail
          VST3=1 bash engine/build.sh 2>&1 | tee build.log || { python3 mac/annot.py Linux-Bau build.log 40 'error|Error|FEHLER|Traceback|No such'; exit 1; }
      - name: Prüfen
        run: |
          set -euo pipefail
          for p in Laney_AOR50 Yamaha_B100II AmpFett_B15NF; do ./engine/build/plugtest engine/build/$p.clap params | head -1; done
          ./engine/build/b15test | tail -3
          ./engine/build/switchtest | tail -1
      - name: Packen
        run: |
          set -euo pipefail
          bash scripts/pack-plugins.sh
          (cd dist && sha256sum *.zip > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5.0.0
        with:
          name: tonestack-linux
          path: |
            dist/*.zip
            dist/SHA256SUMS-linux.txt
  mac:
    runs-on: macos-15   # macos-14 wird von GitHub abgekündigt (Probeabschaltungen ab Ende Oktober 2026)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Werkzeuge
        run: brew install ninja
      - name: Prüfbilder der Oberfläche
        run: |
          set -o pipefail
          bash mac/test/run.sh 2>&1 | tee render.log || { python3 mac/annot.py Pruefbild render.log; exit 1; }
      - name: Konfigurieren
        run: |
          set -o pipefail
          cmake -S engine/vst3 -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cfg.log || { python3 mac/annot.py Konfigurieren cfg.log; exit 1; }
      - name: Bauen
        run: |
          set -o pipefail
          cmake --build build-mac 2>&1 | tee build.log || { python3 mac/annot.py Bauen build.log 40 'error|Error|FAILED'; exit 1; }
      - name: Prüfen, signieren (ad hoc), packen
        run: |
          set -o pipefail
          bash mac/package.sh build-mac out 2>&1 | tee pack.log || { python3 mac/annot.py Packen pack.log; exit 1; }
      - name: Installerpaket bauen und probehalber installieren
        run: |
          set -o pipefail
          { set -e; bash mac/make_pkg.sh build-mac out
            rm -rf ~/Library/Audio/Plug-Ins/Components/Laney_AOR50.component ~/Library/Audio/Plug-Ins/Components/Yamaha_B100II.component ~/Library/Audio/Plug-Ins/Components/AmpFett_B15NF.component
            mkdir -p ~/Library/Audio/Plug-Ins/VST3/AmpFett_B15NF.vst3   # Attrappe einer alten Handinstallation: soll im Papierkorb landen
            echo "::notice title=Konsolenbenutzer::$(stat -f%Su /dev/console) / $(whoami)"
            sudo installer -pkg out/*.pkg -target /
            if [ -e ~/Library/Audio/Plug-Ins/VST3/AmpFett_B15NF.vst3 ]; then echo "::notice title=Altfassung::nicht verschoben (kein angemeldeter Benutzer?)"; rm -rf ~/Library/Audio/Plug-Ins/VST3/AmpFett_B15NF.vst3; else echo "::notice title=Altfassung::in den Papierkorb verschoben: $(ls ~/.Trash | tr '\n' ' ')"; fi
            ls -la /Library/Audio/Plug-Ins/Components /Library/Audio/Plug-Ins/VST3
            killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 3
            for sub in Lany B100 AFB1; do auval -v aufx $sub Tnst | tail -5; auval -v aufx $sub Tnst | grep -q "AU VALIDATION SUCCEEDED" || { echo "FEHLER: auval $sub nach Installation"; exit 1; }; echo "::notice title=auval $sub Kanäle::$(auval -v aufx $sub Tnst | grep -i -A2 "channel capabilities" | tr '\n' ' ')"; done
          } 2>&1 | tee pkg.log || { python3 mac/annot.py Installerpaket pkg.log; exit 1; }
      - name: Prüfsummen
        run: |
          cp mac/test/out/*.png out/
          (cd out && shasum -a 256 *.pkg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5.0.0
        with:
          name: tonestack-mac
          path: |
            out/*.zip
            out/*.pkg
            out/*.png
            out/SHA256SUMS.txt
  publish:
    # Linux- und Mac-Dateien ans Release (nur main). Kein fremder Code läuft hier; nur gh (vorinstalliert).
    needs: [linux, mac]
    if: github.ref == 'refs/heads/main'
    concurrency:   # Veröffentlichungen nacheinander, eine spätere ersetzt eine noch wartende (sonst könnte ein älterer Lauf das neuere Release löschen)
      group: plugins-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0   # v5.0.0
        with:
          name: tonestack-linux
          path: rel
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0   # v5.0.0
        with:
          name: tonestack-mac
          path: mac-art
      - name: Prüfen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd rel && sha256sum -c SHA256SUMS-linux.txt) && (cd mac-art && sha256sum -c SHA256SUMS.txt)
          n=$(ls mac-art/tonestack-Plugins-Mac_*.pkg | wc -l); [ "$n" = 1 ] || { echo "::error::genau ein Installerpaket erwartet, gefunden: $n"; exit 1; }
          cp mac-art/*.pkg rel/; cp mac-art/laney.png rel/mac-laney.png; cp mac-art/yamaha.png rel/mac-yamaha.png; cp mac-art/b15nf.png rel/mac-b15nf.png
          (cd rel && sha256sum *.pkg > SHA256SUMS-mac.txt)
          bash scripts/release.sh rel
