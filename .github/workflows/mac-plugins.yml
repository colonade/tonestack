# Mac-Fassungen der Plugins (Audio Unit für Logic, VST3) auf einem macOS-Rechner von GitHub bauen.
# Start: von Hand (Actions → macOS-Plugins → Run workflow) oder bei jedem Push auf main.
# Ergebnis: Artefakt "tonestack-mac" (ZIPs je Plugin, Installerpaket, Prüfbilder, SHA-256-Summen).
# Sicherheit: Der Bau (fremde Werkzeuge und SDKs) läuft nur mit Leserechten und ohne gespeicherte Zugangsdaten.
# Nur der kleine Veröffentlichungsschritt darf schreiben; er nimmt ausschließlich das Paket und die Prüfbilder aus dem Artefakt.
name: macOS-Plugins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'mac/**', '.github/workflows/mac-plugins.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15   # macos-14 wurde 2026-11-02 abgeschaltet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Werkzeuge
        run: brew install ninja
      - name: Prüfbilder der Oberfläche
        run: |
          set -o pipefail
          bash mac/test/run.sh 2>&1 | tee render.log || { python3 mac/annot.py Pruefbild render.log; exit 1; }
      - name: Konfigurieren
        run: |
          set -o pipefail
          cmake -S engine/vst3 -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cfg.log || { python3 mac/annot.py Konfigurieren cfg.log; exit 1; }
      - name: Bauen
        run: |
          set -o pipefail
          cmake --build build-mac 2>&1 | tee build.log || { python3 mac/annot.py Bauen build.log 40 'error|Error|FAILED'; exit 1; }
      - name: Prüfen, signieren (ad hoc), packen
        run: |
          set -o pipefail
          bash mac/package.sh build-mac out 2>&1 | tee pack.log || { python3 mac/annot.py Packen pack.log; exit 1; }
      - name: Installerpaket bauen und probehalber installieren
        run: |
          set -o pipefail
          { set -e; bash mac/make_pkg.sh build-mac out
            rm -rf ~/Library/Audio/Plug-Ins/Components/Laney_AOR50.component ~/Library/Audio/Plug-Ins/Components/Yamaha_B100II.component
            sudo installer -pkg out/*.pkg -target /
            ls -la /Library/Audio/Plug-Ins/Components /Library/Audio/Plug-Ins/VST3
            killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 3
            for sub in Lany B100; do auval -v aufx $sub Tnst | tail -5; auval -v aufx $sub Tnst | grep -q "AU VALIDATION SUCCEEDED" || { echo "FEHLER: auval $sub nach Installation"; exit 1; }; done
          } 2>&1 | tee pkg.log || { python3 mac/annot.py Installerpaket pkg.log; exit 1; }
      - name: Prüfsummen
        run: |
          cp mac/test/out/*.png out/
          (cd out && shasum -a 256 *.pkg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5.0.0
        with:
          name: tonestack-mac
          path: |
            out/*.zip
            out/*.pkg
            out/*.png
            out/SHA256SUMS.txt
  publish:
    # Installerpaket für die Download-Seite und Prüfbilder zurück ins Repo (nur main). Kein fremder Code läuft hier.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0   # v5.0.0
        with:
          name: tonestack-mac
          path: art
      - name: Paket prüfen und ablegen
        run: |
          set -euo pipefail
          cd art && sha256sum -c SHA256SUMS.txt && cd ..
          n=$(ls art/tonestack-Plugins-Mac_*.pkg | wc -l); [ "$n" = 1 ] || { echo "::error::genau ein Installerpaket erwartet, gefunden: $n"; exit 1; }
          git config user.name "tonestack-mac-bau"; git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          rm -f web/tonestack/download/tonestack-Plugins-Mac_*.pkg
          cp art/tonestack-Plugins-Mac_*.pkg web/tonestack/download/
          mkdir -p mac/test/out && cp art/laney.png art/yamaha.png mac/test/out/
          git add -A web/tonestack/download
          git add -f mac/test/out/laney.png mac/test/out/yamaha.png
          git commit -m "Mac-Installerpaket für die Download-Seite und Prüfbilder: $(basename art/tonestack-Plugins-Mac_*.pkg) [skip ci]" && git push origin HEAD:main || echo "nichts zu übernehmen"
