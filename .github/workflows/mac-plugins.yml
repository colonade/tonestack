# Mac-Fassungen der Plugins (Audio Unit für Logic, VST3) auf einem macOS-Rechner von GitHub bauen.
# Start: von Hand (Actions → macOS-Plugins → Run workflow) oder bei jedem Push auf main.
# Ergebnis: Artefakt "tonestack-mac" mit Laney_AOR50_Mac-<Version>.zip und Yamaha_B100II_Mac-<Version>.zip
name: macOS-Plugins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'mac/**', '.github/workflows/mac-plugins.yml']
jobs:
  build:
    runs-on: macos-15   # macos-14 wird am 2026-11-02 abgeschaltet
    steps:
      - uses: actions/checkout@v5
      - name: Werkzeuge
        run: brew install ninja
      - name: Konfigurieren
        run: |
          set -o pipefail
          cmake -S engine/vst3 -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cfg.log || { python3 mac/annot.py Konfigurieren cfg.log; exit 1; }
      - name: Bauen
        run: |
          set -o pipefail
          cmake --build build-mac 2>&1 | tee build.log || { python3 mac/annot.py Bauen build.log 40 'error|Error|FAILED'; exit 1; }
      - name: Prüfen, signieren (ad hoc), packen
        run: |
          set -o pipefail
          bash mac/package.sh build-mac out 2>&1 | tee pack.log || { python3 mac/annot.py Packen pack.log; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: tonestack-mac
          path: out/*.zip
