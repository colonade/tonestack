# Mac-Fassungen der Plugins (Audio Unit für Logic, VST3) auf einem macOS-Rechner von GitHub bauen.
# Start: von Hand (Actions → macOS-Plugins → Run workflow) oder bei jedem Push auf main.
# Ergebnis: Artefakt "tonestack-mac" mit Laney_AOR50_Mac-<Version>.zip und Yamaha_B100II_Mac-<Version>.zip
name: macOS-Plugins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'mac/**', '.github/workflows/mac-plugins.yml']
jobs:
  build:
    runs-on: macos-15   # macos-14 wird am 2026-11-02 abgeschaltet
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: brew install ninja
      - name: Konfigurieren
        run: cmake -S engine/vst3 -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Bauen
        run: cmake --build build-mac
      - name: Prüfen, signieren (ad hoc), packen
        run: bash mac/package.sh build-mac out
      - uses: actions/upload-artifact@v4
        with:
          name: tonestack-mac
          path: out/*.zip
